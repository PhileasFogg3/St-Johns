<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>St John's Church and Community Centre</title>
  <link rel="stylesheet" href="../stylesheets/styles.css"/>
  <link rel="icon" type="image/x-icon" href="../resources/img/favicon.png">
</head>
<body>
    <div class="page-wrapper">

        <div id="header-placeholder"></div>

            <div class="page-content">

                <main class="main-content">

                    <div class="text-box-container">
                        <div class="text-item">

                            <h2> Find a Song’s Location</h2>

                            <input type="text" id="songSearch" placeholder="Type a song name..." autocomplete="off">
                            <ul id="searchResults"></ul>
                            
                            <p>Or filter through this list of all songs.</p>

                            <select id="songSelect"><option>Loading songs...</option></select>

                            <div id="result">Select a song to see its locations.</div>
                            <div id="embedContainer"></div>

                        </div>
                    </div>

                </main>

            </div>

            <div id="footer-placeholder"></div>

    </div>

    <!--SCRIPTS-->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <script src="../js/musicDatabase.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/header.js"></script>
</body>
</html>
